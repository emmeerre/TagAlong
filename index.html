        :root {
            /* 3 Colonne A4 (63mm x 32mm) */
            --tag-w: 63mm;
            --tag-h: 32mm;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }

        /* --- PANNELLO CONFIGURAZIONE --- */
        .controls-panel {
            max-width: 1450px;
            margin: 0 auto 20px auto;
            background: #1e293b;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .syntax-hint {
            font-size: 11px;
            color: #94a3b8;
        }
        .syntax-hint code {
            background: #0f172a;
            color: #38bdf8;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover { opacity: 0.9; }

        button.btn-add {
            background: #f59e0b;
            color: #0f172a;
        }

        button.btn-print {
            background: #22c55e;
            color: #0f172a;
        }

        /* GRIGLIA CONTROLLI COMPATTA */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 10px;
        }

        .cat-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 9px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cat-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .cat-row input[type="text"] {
            flex-grow: 1;
            padding: 4px 7px;
            font-size: 12px;
            font-weight: 700;
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            border-radius: 4px;
        }

        .cat-row select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            font-size: 11px;
            padding: 4px 6px;
            border-radius: 4px;
            flex-grow: 1;
            width: 50%;
        }

        optgroup {
            background: #0f172a;
            color: #38bdf8;
            font-weight: bold;
        }

        option {
            background: #1e293b;
            color: #f8fafc;
        }

        .color-picker-wrap {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .color-picker-wrap label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
            color: #64748b;
        }

        input[type="color"] {
            width: 24px;
            height: 24px;
            border: 1px solid #475569;
            border-radius: 4px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .size-slider-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-grow: 1;
            background: #1e293b;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        .size-slider-wrap span {
            font-size: 10px;
            color: #38bdf8;
            font-weight: bold;
            min-width: 28px;
            text-align: right;
        }

        .size-slider-wrap input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
            height: 4px;
        }

        .btn-del-cat {
            background: #ef4444;
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .cat-card textarea {
            width: 100%;
            height: 75px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            resize: vertical;
        }

        /* --- FOGLIO A4 PER RITAGLIO A RIGHELLO --- */
        .sheet-container {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            margin: 0 auto;
            padding: 8mm 10.5mm;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
        }

        .tags-grid {
            display: grid;
            grid-template-columns: repeat(3, var(--tag-w));
            grid-auto-rows: var(--tag-h);
            gap: 0;
            background: #fff;
            border: 0.5px dashed #94a3b8;
        }

        /* --- STRUTTURA DEL TAG A 4 RIGHE --- */
        .tag-card {
            width: var(--tag-w);
            height: var(--tag-h);
            position: relative;
            background: #fff;
            box-sizing: border-box;
            outline: 0.4px dashed #94a3b8;
            page-break-inside: avoid;
            break-inside: avoid;
            overflow: hidden;
        }

        .tag-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .tag-content {
            position: absolute;
            top: 1.5mm;
            right: 3mm;
            bottom: 1.5mm;
            left: 12mm;
            z-index: 2;
            display: grid;
            grid-template-rows: 6mm 1fr;
            box-sizing: border-box;
        }

        .shape-arch .tag-content {
            left: 16.5mm !important;
            right: 2.5mm;
        }

        .shape-leaf_vintage .tag-content {
            left: 13mm;
            right: 11mm;
        }

        .shape-ticket .tag-content {
            left: 8.5mm;
            right: 8.5mm;
        }

        .shape-rect .tag-content {
            left: 5mm;
            right: 3mm;
        }

        /* RIGA 1: CATEGORIA */
        .row-category {
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .tag-category-pill {
            font-size: 6.8pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #0f172a;
            background: var(--cat-bg);
            padding: 1px 5px;
            border-radius: 2px;
            border: 1px solid rgba(15, 23, 42, 0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        /* RIGHE 2, 3, 4: BLOCCO TESTO A 3 RIGHE */
        .row-text-block {
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 1px;
        }

        .tag-desc {
            line-height: 1.18;
            width: 100%;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tag-desc strong {
            font-weight: 900 !important;
        }

        /* --- STAMPA --- */
        @media print {
            body {
                background: none !important;
                padding: 0 !important;
            }
            .controls-panel {
                display: none !important;
            }
            .sheet-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 6mm 10.5mm !important;
                width: 100% !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>

        function parseFormatting(text) {
            let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const ESCAPE_TOKEN = "___LITERAL_STAR___";
            s = s.split("**").join(ESCAPE_TOKEN);
            s = s.replace(/\*([^*\n\r]+)\*/g, '<strong>$1</strong>');
            s = s.split(ESCAPE_TOKEN).join("*");
            return s;
        }

        function getEyeletSvg(cx, cy) {
            return `
                <circle cx="${cx}" cy="${cy}" r="4.8" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
                <circle cx="${cx}" cy="${cy}" r="6.8" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="2 1.5"/>
            `;
        }

        function getSvgForCategory(shape, catColor) {
            const w = 200, h = 95;
            let pathD = '';
            let holeSvg = '';
            let accent = '';

            switch(shape) {
                case 'arch':
                    pathD = `M 45.5 2 L ${w-2} 2 L ${w-2} ${h-2} L 45.5 ${h-2} A 45.5 45.5 0 0 1 45.5 2 Z`;
                    accent = `
                        <path d="M 45.5 2 L 45.5 ${h-2} A 45.5 45.5 0 0 1 45.5 2 Z" fill="${catColor}" opacity="0.35"/>
                        <line x1="45.5" y1="2" x2="45.5" y2="${h-2}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
                    `;
                    holeSvg = getEyeletSvg(20, 47.5);
                    break;

                case 'leaf_vintage':
                    pathD = `M 32 2 L ${w-2} 2 L ${w-2} ${h-32} A 30 30 0 0 1 ${w-32} ${h-2} L 2 ${h-2} L 2 32 A 30 30 0 0 1 32 2 Z`;
                    accent = `<path d="M 32 2 L 2 32 L 2 40 L 40 2 Z" fill="${catColor}" opacity="0.5"/>`;
                    holeSvg = getEyeletSvg(16, 18);
                    break;

                case 'ticket':
                    pathD = `M 2 2 L ${w-2} 2 L ${w-2} 36 A 11.5 11.5 0 0 0 ${w-2} 59 L ${w-2} ${h-2} L 2 ${h-2} L 2 59 A 11.5 11.5 0 0 0 2 36 Z`;
                    accent = ''; 
                    holeSvg = '';
                    break;

                case 'rounded':
                    pathD = `M 10 2 L ${w-10} 2 A 8 8 0 0 1 ${w-2} 10 L ${w-2} ${h-10} A 8 8 0 0 1 ${w-10} ${h-2} L 10 ${h-2} A 8 8 0 0 1 2 ${h-10} L 2 10 A 8 8 0 0 1 10 2 Z`;
                    accent = `<rect x="2" y="2" width="6" height="${h-4}" fill="${catColor}" rx="2"/>`;
                    holeSvg = getEyeletSvg(14, 47.5);
                    break;

                case 'scallop':
                    pathD = `M 12 2 L ${w-12} 2 A 10 10 0 0 0 ${w-2} 12 L ${w-2} ${h-12} A 10 10 0 0 0 ${w-12} ${h-2} L 12 ${h-2} A 10 10 0 0 0 2 ${h-12} L 2 12 A 10 10 0 0 0 12 2 Z`;
                    accent = `<line x1="26" y1="2" x2="26" y2="${h-2}" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>`;
                    holeSvg = getEyeletSvg(14, 47.5);
                    break;

                case 'shoulder':
                    pathD = `M 24 2 L ${w-2} 2 L ${w-2} ${h-2} L 24 ${h-2} L 24 72 L 2 72 L 2 23 L 24 23 Z`;
                    accent = `<polygon points="24,2 30,2 30,${h-2} 24,${h-2} 24,72 2,72 2,23 24,23" fill="${catColor}" opacity="0.35"/>`;
                    holeSvg = getEyeletSvg(12, 47.5);
                    break;

                case 'chamfer':
                    pathD = `M 22 2 L ${w-2} 2 L ${w-2} ${h-2} L 22 ${h-2} L 2 ${h-22} L 2 22 Z`;
                    accent = `<polygon points="22,2 29,2 29,${h-2} 22,${h-2} 2,${h-22} 2,22" fill="${catColor}" opacity="0.45"/>`;
                    holeSvg = getEyeletSvg(14, 47.5);
                    break;

                case 'wedge':
                    pathD = `M 24 2 L ${w-2} 2 L ${w-2} ${h-2} L 24 ${h-2} L 2 ${h/2} Z`;
                    accent = `<polygon points="24,2 30,2 30,${h-2} 24,${h-2} 2,${h/2}" fill="${catColor}" opacity="0.45"/>`;
                    holeSvg = getEyeletSvg(15, 47.5);
                    break;

                case 'octa':
                    pathD = `M 10 2 L ${w-10} 2 L ${w-2} 10 L ${w-2} ${h-10} L ${w-10} ${h-2} L 10 ${h-2} L 2 ${h-10} L 2 10 Z`;
                    accent = `<line x1="26" y1="2" x2="26" y2="${h-2}" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>`;
                    holeSvg = getEyeletSvg(14, 47.5);
                    break;

                case 'rect':
                default:
                    pathD = `M 2 2 L ${w-2} 2 L ${w-2} ${h-2} L 2 ${h-2} Z`;
                    accent = `<rect x="2" y="2" width="6" height="${h-4}" fill="${catColor}"/>`;
                    holeSvg = '';
                    break;
            }

            return `
                <svg class="tag-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="${pathD}" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
                    ${accent}
                    ${holeSvg}
                </svg>
            `;
        }

        // Genera le opzioni raggruppate per il selettore del Font
        function buildFontSelectHtml(currentFont) {
            return FONT_GROUPS.map(grp => `
                <optgroup label="${grp.group}">
                    ${grp.fonts.map(f => `
                        <option value="${f.val}" ${currentFont === f.val ? 'selected' : ''}>${f.name}</option>
                    `).join('')}
                </optgroup>
            `).join('');
        }

        function initControls() {
            const container = document.getElementById('categories-ui');
            container.innerHTML = '';

            categories.forEach((cat, index) => {
                const box = document.createElement('div');
                box.className = 'cat-card';
                box.innerHTML = `
                    <div class="cat-row">
                        <input type="text" value="${cat.name}" title="Nome Categoria" oninput="categories[${index}].name = this.value; renderTags();">
                        <div class="color-picker-wrap" title="Colore Sfondo Tag">
                            <label>TAG</label>
                            <input type="color" value="${cat.color}" oninput="categories[${index}].color = this.value; renderTags();">
                        </div>
                        <button class="btn-del-cat" title="Elimina Categoria" onclick="deleteCategory(${index})">✕</button>
                    </div>

                    <div class="cat-row">
                        <select onchange="categories[${index}].shape = this.value; renderTags();">
                            <option value="arch" ${cat.shape === 'arch' ? 'selected' : ''}>Cupola / Arco a Sx</option>
                            <option value="leaf_vintage" ${cat.shape === 'leaf_vintage' ? 'selected' : ''}>Foglia (Angoli Opposti)</option>
                            <option value="ticket" ${cat.shape === 'ticket' ? 'selected' : ''}>Ticket con Tacche (No Foro)</option>
                            <option value="rounded" ${cat.shape === 'rounded' ? 'selected' : ''}>Rettangolo Arrotondato</option>
                            <option value="scallop" ${cat.shape === 'scallop' ? 'selected' : ''}>Angoli a Scasso (Scallop)</option>
                            <option value="shoulder" ${cat.shape === 'shoulder' ? 'selected' : ''}>Spalline a Gradino</option>
                            <option value="chamfer" ${cat.shape === 'chamfer' ? 'selected' : ''}>Smussato 45° a Sx</option>
                            <option value="wedge" ${cat.shape === 'wedge' ? 'selected' : ''}>Punta a Freccia a Sx</option>
                            <option value="octa" ${cat.shape === 'octa' ? 'selected' : ''}>Ottagonale Tecnico</option>
                            <option value="rect" ${cat.shape === 'rect' ? 'selected' : ''}>Rettangolare Squadrato</option>
                        </select>

                        <select onchange="categories[${index}].font = this.value; renderTags();">
                            ${buildFontSelectHtml(cat.font)}
                        </select>
                    </div>

                    <div class="cat-row">
                        <div class="color-picker-wrap" title="Colore Testo">
                            <label>TESTO</label>
                            <input type="color" value="${cat.textColor || '#000000'}" oninput="categories[${index}].textColor = this.value; renderTags();">
                        </div>
                        <div class="size-slider-wrap">
                            <input type="range" min="5" max="40" step="0.5" value="${cat.textSize || 14}" 
                                   oninput="categories[${index}].textSize = this.value; document.getElementById('size-val-${index}').innerText = this.value + 'px'; renderTags();">
                            <span id="size-val-${index}">${cat.textSize || 14}px</span>
                        </div>
                    </div>

                    <textarea oninput="categories[${index}].text = this.value; renderTags();">${cat.text}</textarea>
                `;
                container.appendChild(box);
            });

            renderTags();
        }

        function addCategory() {
            categories.push({
                name: "Nuova Categoria",
                color: "#cbd5e1",
                shape: "arch",
                font: "'Montserrat', sans-serif",
                textColor: "#000000",
                textSize: 14,
                text: "*Elemento 1*\nElemento con ** (asterisco)\nAltro *testo grande*"
            });
            initControls();
        }

        function deleteCategory(index) {
            if (confirm(`Eliminare la categoria "${categories[index].name}"?`)) {
                categories.splice(index, 1);
                initControls();
            }
        }

        function renderTags() {
            const grid = document.getElementById('tags-grid');
            grid.innerHTML = '';

            categories.forEach(cat => {
                const lines = cat.text.split('\n');

                lines.forEach(line => {
                    const rawText = line.trim();
                    if (rawText.length > 0) {
                        const parsedHtml = parseFormatting(rawText);
                        const card = document.createElement('div');
                        card.className = `tag-card shape-${cat.shape}`;
                        card.style.setProperty('--cat-bg', cat.color);

                        card.innerHTML = `
                            ${getSvgForCategory(cat.shape, cat.color)}
                            <div class="tag-content">
                                <div class="row-category">
                                    <div class="tag-category-pill">${cat.name}</div>
                                </div>
                                <div class="row-text-block">
                                    <div class="tag-desc" style="
                                        font-family: ${cat.font};
                                        color: ${cat.textColor || '#000000'};
                                        font-size: ${cat.textSize || 14}px;
                                        font-weight: 500;
                                    ">${parsedHtml}</div>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });
            });

            autoFitOversizedText();
        }

        function autoFitOversizedText() {
            document.querySelectorAll('.tag-desc').forEach(el => {
                let currentSize = parseFloat(el.style.fontSize);
                const parent = el.closest('.row-text-block');

                while ((el.scrollHeight > parent.clientHeight || el.scrollWidth > parent.clientWidth) && currentSize > 5) {
                    currentSize -= 0.5;
                    el.style.fontSize = currentSize + 'px';
                }
            });
        }

        // Quando i font di Google completano il download, ricalcola il fit per precisione tipografica
        if (document.fonts) {
            document.fonts.ready.then(() => {
                autoFitOversizedText();
            });
        }

        window.onload = initControls;
    </script>
</body>
</html>
